<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" role="img" aria-label="Two ways I work: notebook brain makes models explainable, product brain ships them to users">
<style>
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 3.4s ease-in-out infinite alternate}
.trav{animation:trav 3s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
.in{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes grow{0%{transform:scaleX(.08)}55%,100%{transform:scaleX(1)}}
@keyframes trav{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(222px);opacity:0}}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.2)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes flow{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
text{font-family:'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif}
</style>
<rect x="0.5" y="0.5" width="879" height="319" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="440" y="40" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="4" fill="#8b949e">TWO WAYS I WORK</text>
<line x1="250" y1="35" x2="340" y2="35" stroke="#21262d" stroke-width="2"/><line x1="540" y1="35" x2="630" y2="35" stroke="#21262d" stroke-width="2"/>
<g class="in" style="animation-delay:0.1s"><rect x="24" y="66" width="400" height="232" rx="14" fill="#161b22" stroke="#30363d"/><rect x="24" y="66" width="4" height="232" rx="2" fill="#8b5cf6"/><rect x="48" y="86" width="139.60000000000002" height="22" rx="11" fill="#8b5cf6" fill-opacity=".16"/><text x="59" y="101" font-size="10.5" font-weight="800" letter-spacing="1.4" fill="#8b5cf6">NOTEBOOK BRAIN</text><text x="48" y="142" font-size="18.5" font-weight="700" fill="#e6edf3">Make the model explain itself</text><text x="48" y="168" font-size="12.5" fill="#8b949e">XGBoost + AHP scoring on 3,000+ EV stations</text><text x="48" y="188" font-size="12.5" fill="#8b949e">SHAP so every ranking comes with a reason</text><text x="48" y="208" font-size="12.5" fill="#8b949e">GeoPandas · PostGIS · Azure Databricks</text><text x="48" y="236" font-size="10" letter-spacing="1.4" font-weight="700" fill="#8b949e">FEATURE IMPACT</text><rect x="48" y="244" width="300" height="7" rx="3.5" fill="#8b5cf6" fill-opacity="1.00" class="grow" style="animation-delay:0s"/><rect x="48" y="255" width="226" height="7" rx="3.5" fill="#8b5cf6" fill-opacity="0.80" class="grow" style="animation-delay:0.4s"/><rect x="48" y="266" width="172" height="7" rx="3.5" fill="#8b5cf6" fill-opacity="0.60" class="grow" style="animation-delay:0.8s"/><rect x="48" y="277" width="118" height="7" rx="3.5" fill="#8b5cf6" fill-opacity="0.40" class="grow" style="animation-delay:1.2s"/></g>
<g class="in" style="animation-delay:0.25s"><rect x="456" y="66" width="400" height="232" rx="14" fill="#161b22" stroke="#30363d"/><rect x="456" y="66" width="4" height="232" rx="2" fill="#14b8a6"/><rect x="480" y="86" width="131.2" height="22" rx="11" fill="#14b8a6" fill-opacity=".16"/><text x="491" y="101" font-size="10.5" font-weight="800" letter-spacing="1.4" fill="#14b8a6">PRODUCT BRAIN</text><text x="480" y="142" font-size="18.5" font-weight="700" fill="#e6edf3">Ship it so people can use it</text><text x="480" y="168" font-size="12.5" fill="#8b949e">FastAPI · Flask backends, React frontends</text><text x="480" y="188" font-size="12.5" fill="#8b949e">Five live products: slides, careers, health, resumes, campus</text><text x="480" y="208" font-size="12.5" fill="#8b949e">Gemini API workflows on Supabase, MongoDB, Redis</text><line x1="550" y1="253" x2="772" y2="253" stroke="#14b8a6" stroke-width="1.5" class="flow" opacity=".7"/><rect x="480" y="238" width="70" height="30" rx="9" fill="none" stroke="#14b8a6" stroke-width="1.5"/><text x="515" y="257.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6edf3">client</text><rect x="621" y="238" width="82" height="30" rx="9" fill="none" stroke="#14b8a6" stroke-width="1.5"/><text x="662" y="257.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6edf3">FastAPI</text><rect x="772" y="238" width="60" height="30" rx="9" fill="none" stroke="#14b8a6" stroke-width="1.5"/><text x="802" y="257.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#e6edf3">model</text><circle cx="550" cy="253" r="4.5" fill="#14b8a6" class="trav"/><text x="480" y="292" font-size="10" letter-spacing="1.4" font-weight="700" fill="#8b949e">REQUEST → RESPONSE</text></g>
<circle cx="440" cy="182" r="17" fill="#8b5cf6" class="pulse" opacity=".5"/><circle cx="440" cy="182" r="17" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><path d="M432 182 H446 M441 177 L447 182 L441 187" fill="none" stroke="#e6edf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
